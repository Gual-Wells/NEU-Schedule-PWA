name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate static app
        run: |
          node --check app.js
          node --check gym-store.js
          node --check sw.js
          node scripts/validate.mjs
          node scripts/validate-ui.mjs
          node scripts/validate-gym.mjs
          node scripts/validate-push.mjs
      - name: Prepare public files
        run: |
          mkdir public
          cp index.html app.js gym-store.js data.js push-config.js styles.css sw.js manifest.webmanifest .nojekyll public/
          cp -r icons public/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
