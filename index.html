<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#174b84" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="课表" />
  <meta name="format-detection" content="telephone=no" />
  <title>课表</title>
  <link rel="manifest" href="./manifest.webmanifest?v=41" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=41" />
</head>
<body>
  <main class="app-shell" id="app">
    <header class="app-header">
      <div class="header-brand">
        <div class="header-meta-row"><p class="header-meta" id="headerMeta"></p><span class="brand-mark">NEU SCHEDULE</span></div>
        <h1>个人课表</h1>
      </div>
      <div class="header-actions"><button class="ghost-button" id="agendaButton" type="button">事项</button><button class="ghost-button" id="cloudButton" type="button">云端</button><button class="ghost-button" id="pushSettingsButton" type="button">提醒</button><button class="ghost-button" id="jumpToday" type="button" hidden>回到今天</button></div>
    </header>

    <section class="week-card" id="weekCard">
      <div class="week-nav-row" id="weekSwipeZone">
        <button class="round-button" id="prevWeek" type="button" aria-label="上一周">‹</button>
        <button class="week-summary" id="weekPickerButton" type="button" aria-label="选择教学周">
          <strong id="weekTitle"></strong>
          <span id="weekRange"></span>
        </button>
        <button class="round-button" id="nextWeek" type="button" aria-label="下一周">›</button>
      </div>
      <div class="day-strip" id="dayStrip" aria-label="选择日期"></div>
    </section>

    <section class="toolbar">
      <div class="segmented" role="tablist" aria-label="显示方式">
        <button class="segment active" data-mode="week" type="button">周表</button>
        <button class="segment" data-mode="day" type="button">日程</button>
        <button class="segment" data-mode="gym" type="button">健身</button>
      </div>
      <div class="toolbar-side">
        <div class="legend-chip"><span class="legend-swatch odd"></span><span class="legend-swatch even"></span><span>健身房开放</span></div>
        <span class="toolbar-note" id="toolbarNote"></span>
      </div>
    </section>

    <section class="panel active week-panel" id="weekPanel">
      <div class="timeline-shell">
        <div class="timeline-scroll" id="timelineScroll" tabindex="0">
          <div class="timeline-grid" id="timelineGrid"></div>
        </div>
      </div>
    </section>

    <section class="panel day-panel" id="dayPanel">
      <article class="day-dashboard" id="dayDashboard"></article>
      <section class="day-map" id="dayMap" aria-label="当日真实时间日程"></section>
    </section>

    <section class="panel gym-panel" id="gymPanel" aria-label="健身记录与统计"></section>
  </main>

  <dialog id="agendaDialog" class="sheet-dialog">
    <div class="sheet agenda-sheet">
      <div class="sheet-head"><div><span class="sheet-kicker">DDL · 活动 · 组会汇总</span><h2>事项与图片导入</h2></div><button type="button" class="close-button" id="closeAgenda" aria-label="关闭">×</button></div>
      <div id="agendaUploadPanel" class="agenda-upload"><label>通知截图（1–8 张）<input id="agendaImage" type="file" accept="image/png,image/jpeg,image/webp" multiple /></label><p id="agendaSelectionStatus" role="status"></p><div id="agendaImageList" class="agenda-image-list"></div><label>事项备注（可选）<input id="agendaNote" maxlength="800" placeholder="事项名称或补充线索" /></label><div class="push-actions"><button type="button" id="agendaUpload" disabled>生成事项</button><button type="button" id="agendaDiscard" disabled>清空草稿</button><button type="button" id="agendaManual">手动添加</button></div></div>
      <div class="push-actions"><button type="button" id="agendaRefresh">刷新状态</button></div>
      <p id="agendaStatus" role="status" class="calendar-status"></p>
      <div id="agendaContent"></div>
      <section id="agendaReview" hidden aria-label="事项申请审核">
        <div id="agendaReviewResult"></div>
        <p id="agendaReviewStatus" role="status"></p>
        <div class="push-actions"><button type="button" id="agendaConfirm">确认此事项入表</button><button type="button" id="agendaReviewBack">返回</button></div>
        <div class="agenda-feedback"><label for="agendaFeedback">反馈修改</label><textarea id="agendaFeedback" maxlength="2000" rows="3" placeholder="需要修正或补充的信息"></textarea><button type="button" id="agendaSendFeedback">提交反馈并重新生成</button></div>
      </section>
      <form id="agendaEditor" hidden><p id="agendaSource"></p><div id="agendaCandidates"></div><p id="agendaEditorStatus" role="status"></p><div class="push-actions"><button type="submit">添加事项</button><button type="button" id="agendaBack">返回</button></div></form>
    </div>
  </dialog>

  <dialog id="agendaDetailDialog" class="sheet-dialog" aria-labelledby="agendaDetailTitle">
    <div class="sheet">
      <div class="sheet-head"><div><span class="sheet-kicker" id="agendaDetailKind">事项详情</span><h2 id="agendaDetailTitle"></h2></div><button type="button" class="close-button" id="closeAgendaDetail" aria-label="关闭">×</button></div>
      <div id="agendaDetailBody" class="detail-grid"></div>
      <div id="agendaDetailSources"></div>
      <p id="agendaDetailStatus" class="calendar-status" role="status"></p>
      <div class="push-actions agenda-detail-actions"><button type="button" id="agendaDetailEnd">结束活动</button><button type="button" id="agendaDetailCancel" hidden>取消安排</button></div>
    </div>
  </dialog>

  <dialog id="nonCourseDialog" class="sheet-dialog"><div class="sheet agenda-sheet"><div class="sheet-head"><h2 id="nonCourseTitle">当天安排</h2><button type="button" id="closeNonCourse" class="close-button" aria-label="关闭">×</button></div><div id="nonCourseContent"></div></div></dialog>

  <dialog id="courseDialog" class="sheet-dialog">
    <form method="dialog" class="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <div>
          <span class="sheet-kicker">课程详情</span>
          <h2 id="courseDetailTitle"></h2>
        </div>
        <button class="close-button" value="cancel" aria-label="关闭">×</button>
      </div>
      <div id="courseDetailBody" class="detail-grid"></div>
      <button id="skipCourseButton" class="detail-skip" type="button">恢复这节课</button>
    </form>
  </dialog>

  <dialog id="meetingDetailDialog" class="sheet-dialog">
    <div class="sheet">
      <div class="sheet-head"><div><span class="sheet-kicker">组会详情</span><h2 id="meetingDetailTitle">组会</h2></div><button class="close-button" type="button" id="closeMeetingDetail" aria-label="关闭">×</button></div>
      <div class="detail-grid" id="meetingDetailBody"></div>
      <p id="meetingDetailStatus" class="meeting-explainer" role="status"></p>
      <div class="push-actions"><button type="button" id="meetingEndButton" hidden>结束组会</button><button type="button" id="meetingCancelButton" hidden>取消安排</button></div>
    </div>
  </dialog>

  <dialog id="weekDialog" class="sheet-dialog">
    <form method="dialog" class="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <div>
          <span class="sheet-kicker">教学周</span>
          <h2>跳到某一周</h2>
        </div>
        <button class="close-button" value="cancel" aria-label="关闭">×</button>
      </div>
      <div id="weekChoices" class="week-picker-grid"></div>
    </form>
  </dialog>

  <dialog id="calendarDialog" class="sheet-dialog">
    <div class="sheet calendar-sheet">
      <div class="sheet-head"><div><span class="sheet-kicker">本学期安排</span><h2>放假与调休</h2></div><button class="close-button" id="closeCalendarDialog" type="button" aria-label="关闭">×</button></div>
      <section class="calendar-section">
        <strong>放假</strong>
        <div class="calendar-fields"><label>开始日期<input id="holidayStart" type="date" /></label><label>结束日期<input id="holidayEnd" type="date" /></label></div>
        <button class="calendar-command" id="addHoliday" type="button">设为放假</button>
      </section>
      <section class="calendar-section">
        <strong>调休补课</strong>
        <div class="calendar-fields"><label>补课日期（无课程日）<input id="makeupTarget" type="date" /></label><label>原课程日期<input id="makeupSource" type="date" /></label></div>
        <button class="calendar-command" id="addMakeup" type="button">确认调休</button>
      </section>
      <p class="calendar-status" id="calendarStatus" role="status"></p>
      <div class="calendar-records" id="calendarRecords"></div>
    </div>
  </dialog>

  <dialog id="pushDialog" class="sheet-dialog">
    <div class="sheet push-sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-head"><div><span class="sheet-kicker">后台推送</span><h2>课程、健身与事项提醒</h2></div><button class="close-button" id="closePushDialog" type="button" aria-label="关闭">×</button></div>
      <p class="push-status" id="pushStatus" role="status"></p>
      <div class="push-actions"><button id="enablePush" type="button">开启后台提醒</button><button id="testPush" type="button">发送测试</button><button id="disablePush" type="button">关闭提醒</button></div>
    </div>
  </dialog>

  <dialog id="cloudDialog" class="sheet-dialog">
    <div class="sheet push-sheet">
      <div class="sheet-head"><div><span class="sheet-kicker">数据同步</span><h2>云端课表与记录</h2></div><button class="close-button" id="closeCloudDialog" type="button" aria-label="关闭">×</button></div>
      <p class="push-status" id="cloudStatus" role="status"></p>
      <div class="push-actions"><button id="connectCloud" type="button">立即同步</button><button id="logoutCloud" type="button">退出登录</button></div>
    </div>
  </dialog>

  <dialog id="sessionDialog" class="sheet-dialog">
    <form class="sheet" id="sessionForm">
      <div class="sheet-head"><div><span class="sheet-kicker">健身记录</span><h2>修改训练时间</h2></div><button class="close-button" type="button" id="closeSessionDialog" aria-label="关闭">×</button></div>
      <label class="push-label" for="sessionStart">开始</label><input class="push-input" id="sessionStart" type="datetime-local" required />
      <label class="push-label" for="sessionEnd">结束</label><input class="push-input" id="sessionEnd" type="datetime-local" required />
      <p class="push-status" id="sessionStatus" role="status"></p>
      <div class="push-actions"><button type="submit">保存修改</button><button id="deleteSession" type="button">删除记录</button></div>
    </form>
  </dialog>

  <script src="./daily-reminders.js?v=41"></script>
  <script src="./agenda-core.js?v=41"></script>
  <script src="./agenda-upload.js?v=41"></script>
  <script src="./agenda-client.js?v=41"></script>
  <script src="./gym-store.js?v=41"></script>
  <script src="./meeting-store.js?v=41"></script>
  <script src="./webauthn-browser.js?v=41"></script>
  <script src="./auth-client.js?v=41"></script>
  <script src="./cloud-sync.js?v=41"></script>
  <script src="./bootstrap.js?v=41"></script>
</body>
</html>
