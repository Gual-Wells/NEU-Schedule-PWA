<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="课表" />
  <meta name="format-detection" content="telephone=no" />
  <title>课表</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell" id="app">
    <header class="app-header">
      <div>
        <div class="header-date" id="headerDate"></div>
        <h1>课表</h1>
      </div>
      <button class="header-action" id="jumpToday" type="button" hidden>回本周</button>
    </header>

    <section class="week-swipe-zone" id="weekSwipeZone">
      <div class="week-nav">
        <button class="round-button" id="prevWeek" type="button" aria-label="上一周">‹</button>
        <button class="week-center" id="weekPickerButton" type="button" aria-label="选择教学周">
          <strong id="weekTitle"></strong>
          <span id="weekRange"></span>
        </button>
        <button class="round-button" id="nextWeek" type="button" aria-label="下一周">›</button>
      </div>
      <div class="day-strip" id="dayStrip" aria-label="选择日期"></div>
    </section>

    <div class="schedule-toolbar">
      <div class="segmented" role="tablist" aria-label="课表显示方式">
        <button class="segment active" data-mode="week" type="button">周表</button>
        <button class="segment" data-mode="day" type="button">日程</button>
      </div>
      <div class="gym-legend" title="浅绿色背景代表健身房开放">
        <span class="gym-legend-swatch"></span>
        <span>健身房开放</span>
      </div>
    </div>

    <section class="week-panel active" id="weekPanel">
      <div class="timetable-shell">
        <div class="timetable-scroll" id="timetableScroll" tabindex="0">
          <div class="timetable-grid" id="timetableGrid"></div>
        </div>
      </div>
      <p class="micro-hint">绿色背景＝健身房开放 · 虚线＝开放时刻与课程节次未对齐 · 点课程看详情</p>
    </section>

    <section class="day-panel" id="dayPanel">
      <div class="day-summary" id="daySummary"></div>
      <div class="agenda-list" id="agendaList"></div>
    </section>
  </main>

  <dialog id="courseDialog" class="sheet-dialog">
    <form method="dialog" class="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <div>
          <span class="section-kicker">课程详情</span>
          <h2 id="courseDetailTitle"></h2>
        </div>
        <button class="close-button" value="cancel" aria-label="关闭">×</button>
      </div>
      <div id="courseDetailBody" class="detail-grid"></div>
    </form>
  </dialog>

  <dialog id="weekDialog" class="sheet-dialog">
    <form method="dialog" class="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <div>
          <span class="section-kicker">教学周</span>
          <h2>跳到某一周</h2>
        </div>
        <button class="close-button" value="cancel" aria-label="关闭">×</button>
      </div>
      <div class="week-picker-grid" id="weekChoices"></div>
    </form>
  </dialog>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
